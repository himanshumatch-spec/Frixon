name: Build FF Arena Admin APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build admin release APK
        run: gradle assembleAdminRelease --stacktrace

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: ff-arena-admin-apk
          path: app/build/outputs/apk/admin/release/app-admin-release.apk
          if-no-files-found: error
          retention-days: 14
